[project]
name = "tracker-microservices"
version = "0.1.0"
description = "Task Tracker Project"
requires-python = ">=3.12"

# The repository root is a workspace, not an installable package: the real
# packages are common/, gateway/ and each services/*, every one with its own
# pyproject.toml. Without this, uv asks setuptools to build the root and
# setuptools refuses -- it finds six top-level directories and cannot guess
# which one is the package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "venv",
    "common/alembic/versions",  # autogenerated migrations
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = ["common", "gateway", "services/*"]

[tool.uv.sources]
task_tracker_common = { workspace = true }

